<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lofoten Lifeline — a rescue floatplane over the Lofoten Islands</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    width: min(100vw, 160vh);
    height: min(100vh, 62.5vw);
    touch-action: none;
    background: #0b1220;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Lofoten Lifeline: fly a rescue floatplane through the Lofoten Islands, thread the gold rings and land on the water"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
